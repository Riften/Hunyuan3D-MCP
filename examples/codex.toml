# Install the Python package and make its command available on PATH first.
[mcp_servers.hunyuan3d]
command = "hunyuan3d-mcp"
env_vars = ["TENCENTCLOUD_SECRET_ID", "TENCENTCLOUD_SECRET_ID", "TENCENTCLOUD_SECRET_KEY", "TENCENTCLOUD_TOKEN", "TENCENTCLOUD_REGION", "HY3D_PROXY", "HY3D_TIMEOUT_SECONDS", "HTTPS_PROXY", "HTTP_PROXY", "ALL_PROXY", "NO_PROXY"]
startup_timeout_sec = 20
tool_timeout_sec = 180
